# PMHM pipeline configuration. All paths are relative to `dataset_root` unless absolute.
# Raw data stays in place (never copied); the pipeline only reads it.

dataset_root: /home/alifhossain/SPECTRALPACA

raw:
  metadata_json: data/metadata.json
  ximea_dir: data/ximea
  dark_reference: data/ximea/dark.b2nd          # README calls it dark.npy; local file is blosc2 .b2nd
  white_reference: data/ximea/white.b2nd        # NOT present locally (see docs/PROJECT_STATUS.md)
  spectrometer_csv: data/spectrometer/spectrometer.csv
  spectrometer_feather: data/spectrometer/spectrometer.feather
  rois_dir: intermediates/rois
  optics_dir: intermediates/optics
  color_checker_dir: intermediates/color_checker

outputs:
  processed_dir: data/processed
  parquet_dir: data/processed/parquet           # primary analytical dataset (full run)
  pilot_dir_template: data/processed/pilot_{subject}
  versions_dir: data/processed/_versions        # previous outputs are moved here, never deleted
  logs_dir: logs
  reports_dir: reports

camera:
  model: XIMEA MQ022HG-IM-SM4x4-VIS
  height_px: 272
  width_px: 512
  # Channel order of the cube's last axis (README.md). Cross-checked against filter peaks and colour-checker bands.
  channel_wavelengths_nm: [488, 496, 478, 465, 598, 609, 585, 574, 641, 493, 632, 622, 538, 550, 524, 511]

spectrometer:
  model: Ocean Insight HR2000+
  # Mapping of spectrometer stage labels to cube stage labels (README: "baseline (before_clamping) and 160 mmHg").
  stage_map:
    "baseline (0 mmHg)": before_clamping
    "160 mmHg": during_clamping_160mmHg

conversion:
  csv_chunk_rows: 5000          # initial chunk size (directive)
  min_chunk_rows: 1000
  max_chunk_rows: 50000
  shrink_below_available_mb: 500   # halve chunk size when available RAM falls below this
  grow_above_available_mb: 1500    # allow doubling when RAM is plentiful
  abort_below_available_mb: 150    # stop cleanly rather than destabilise the OS
  max_row_group_rows: 200000
  compression: snappy
  hash_cubes: false             # sha256 of 20+ GB cubes is slow; sizes + headers are recorded instead
